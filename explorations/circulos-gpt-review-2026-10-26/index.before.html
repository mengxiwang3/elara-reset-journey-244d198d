{id:1,tag:'fam',isNew:true,circle:'Dinero y familia',t:'Mi hermana me pide dinero otra vez y no sé cómo decirle que no',who:'Marisol',ago:'hace 2 h',me:23,
 short:'Me pide plata cada mes, ya le presté y no me devolvió. Quiero decir que no sin pelear.',
 body:'Mi hermana me escribió otra vez para pedirme prestado. Ya van tres veces este año y la última no me devolvió nada, ni siquiera me dijo cuándo.\n\nNo quiero pelearme con ella, pero tampoco puedo seguir así: este mes yo misma voy justa con la renta.\n\nCada vez que pienso en decirle que no, me siento mala hermana y termino diciendo que sí.\n\n¿Cómo le dicen que no sin que se arme un drama? ¿Les ha pasado?',
 replies:[
 {id:11,who:'Lucía',ago:'hace 1 h',useful:18,top:true,txt:'A mí me ayudó decidir ANTES cuánto sí puedo dar, aunque sea poco, y decirlo como un hecho: “este mes puedo darte 20, no más”. Así no estás diciendo que no a ella, estás diciendo cuánto hay.',kids:[
   {id:111,who:'Marisol',ago:'hace 50 min',useful:2,txt:'Eso de decirlo como un hecho me gusta. Me da miedo que me pregunte por qué no más.',kids:[
     {id:1111,who:'Lucía',ago:'hace 40 min',useful:5,txt:'No tienes que dar razones. “Es lo que tengo este mes” alcanza. Si insiste, repites lo mismo igual de tranquila.',kids:[]}]},
   {id:112,who:'Paola',ago:'hace 30 min',useful:1,txt:'Yo hago lo mismo pero con fecha: “te puedo ayudar el día 15”. Así no queda como “nunca”.',kids:[]}]},
 {id:12,who:'Renata',ago:'hace 1 h',useful:9,txt:'Antes de prestar, pregúntate: ¿si no me lo devuelve, estoy bien? Si la respuesta es no, ese dinero no es para prestar.',kids:[
   {id:121,who:'Marisol',ago:'hace 45 min',useful:3,txt:'Me hizo caer en cuenta: la renta no la puedo arriesgar.',kids:[]}]},
 {id:13,who:'Dani',ago:'hace 20 min',useful:4,isNew:true,txt:'A mí lo que me funcionó fue escribirle en vez de llamar. Tengo tiempo de pensar lo que digo.',kids:[]}]},
{id:2,tag:'trab',circle:'Trabajo',t:'¿Alguien aceptó un trabajo sin saber cuándo le pagaban?',who:'Ximena',ago:'hace 5 h',me:11,
 short:'Me ofrecen horas pero no dicen el día de pago. ¿Pregunto o dejo pasar?',
 body:'Me ofrecieron trabajo por horas en una tienda. Dicen cuánto pagan por hora pero no cuándo ni cómo pagan.\n\nMe da pena preguntar porque no quiero parecer desconfiada.\n\n¿Ustedes preguntan?',
 replies:[
 {id:21,who:'Camila',ago:'hace 4 h',useful:12,top:true,txt:'Pregunta. Una frase corta basta: “¿cuándo y cómo se paga?”. Si no quieren contestar eso, ya sabes algo.',kids:[]},
 {id:22,who:'Sofi',ago:'hace 3 h',useful:3,txt:'A mí me pasó y preguntaron raro. Al final pagaban a fin de mes y estuvo bien, pero me alegra haber preguntado.',kids:[]},
 {id:23,who:'Ana',ago:'hace 1 h',useful:1,txt:'¿Y si preguntas también si hay costos de tu parte? Yo olvidé eso y me salió el transporte.',kids:[]}]},
{id:3,tag:'ban',circle:'Dinero y calma',t:'Me da vergüenza mirar mi cuenta del banco',who:'Vale',ago:'ayer',me:31,
 short:'Llevo semanas sin abrir la app del banco.',
 body:'Llevo semanas sin abrir la app del banco. Sé que debería, pero me da como un nudo en el estómago.\n\n¿Alguien más?',
 replies:[
 {id:31,who:'Rocío',ago:'ayer',useful:14,top:true,txt:'Sí. Yo empecé mirando solo el saldo, nada más, treinta segundos. Después fui agregando.',kids:[]},
 {id:32,who:'Eli',ago:'ayer',useful:6,txt:'A mí me ayudó abrirla acompañada, con una amiga al lado.',kids:[]}]},
{id:4,tag:'ren',circle:'Dinero y calma',t:'Cómo organizo lo que pago el día 1 y el día 15',who:'Gaby',ago:'ayer',me:7,
 short:'Mi pago cae el 15 y la renta vence el 1.',
 body:'Mi pago cae el día 15 pero la renta vence el día 1. Siempre llego justa al final del mes.\n\n¿Cómo le hacen ustedes?',
 replies:[{id:41,who:'Nina',ago:'ayer',useful:5,top:true,txt:'Yo separo la renta el mismo día que cobro, en cuanto llega, antes de gastar nada.',kids:[]}]},
{id:5,tag:'ren',circle:'Dinero y familia',t:'Hoy fue un día difícil con la renta',who:'Aline',ago:'hace 2 días',me:15,

function circleArt(){return ''}

function canContact(name){return name!=='Anónima'&&name!=='Tú'&&name!=='Sofía'}
function person(name,time){const face=avatar(name)+`<strong>${esc(name)}</strong>`;return `<div class="person">${canContact(name)?btn(face,'member',`data-name="${esc(name)}" aria-label="Ver perfil de ${esc(name)}"`,'member-link'):`<span class="member-static">${face}</span>`}<span class="person-time">· ${esc(time)}</span></div>`}

function circleFeed(){const list=allPosts().filter(p=>(p.circle||'money')===s.circle).filter(p=>s.filter==='all'||p.tag===s.filter);return `<div class="bar">${btn('Volver','hub-home')}${btn('Ayuda','help')}</div><section class="scroll"><div class="circle-title">${circleArt(s.circle)}<h1>${circle().name}</h1></div><p class="sub circle-description">${circle().desc}</p><div class="membership"><span>Ya eres parte</span>${btn('Normas','rules')}${btn('Ajustes','settings')}</div>${circle().tags.length?`<div class="filters" aria-label="Filtrar por tema">${[['all','Todo'],...circle().tags.map(k=>[k,tags[k]])].map(([k,t])=>btn(t,'filter',`data-tag="${k}" aria-pressed="${s.filter===k}"`)).join('')}</div>`:''}${list.length?list.map(p=>row(p)).join(''):`<div class="empty"><h2>Aún no hay conversaciones</h2><p>Tu experiencia puede abrir la primera.</p>${btn('Compartir algo','compose','','primary')}</div>`}</section><footer class="bottom">${btn('Escribir en este círculo','compose','','primary')}<nav class="nav" aria-label="Navegación principal">${['Hoy','Atlas','Pregunta','Explorar'].map(t=>btn(t,'outside',`data-name="${t}"`)).join('')}${btn('Círculos','hub-home','aria-current="page"')}</nav></footer>`}

function reply(r,depth,top){const fold=!!s.folded[r.id];return `<article class="reply ${depth?'child':''}" id="reply-${r.id}"><div class="reply-heading">${person(r.who,r.ago)}${btn(fold?'Mostrar':'Plegar','fold',`data-id="${r.id}" aria-expanded="${!fold}" aria-label="${fold?'Mostrar':'Plegar'} respuesta de ${esc(r.who)}"`,'reply-fold')}</div>${!fold?`<p>${esc(r.txt)}</p><div class="actions">${btn('Me sirve','vote',`data-id="${r.id}" aria-pressed="${!!s.votes[r.id]}"`)}${btn('Responder','reply',`data-id="${r.id}" data-who="${esc(r.who)}"`)}</div>${(r.kids||[]).map(k=>reply(k,Math.min(depth+1,1),top)).join('')}`:''}</article>`}

function thread(){const p=getPost(s.page);if(!p){s.page=null;return feed()}const top=best(p),rs=replies(p).slice().sort(s.sort==='new'?(a,b)=>(b.order||b.id)-(a.order||a.id):(a,b)=>score(b)-score(a)||a.id-b.id),target=s.targets[p.id];return `<div class="bar">${btn('Volver','back')}<strong>${CIRCLES[p.circle||'money'].name}</strong>${btn('Ayuda','help')}</div><section class="scroll"><article class="post"><span class="meta">${tags[p.tag]}</span><h1>${esc(p.t)}</h1><div class="post-author">${person(p.who,p.ago)}</div><p>${esc(p.body)}</p>${btn('Me pasa también','me',`data-id="${p.id}" aria-pressed="${!!s.me[p.id]}"`,'outline')}</article><div class="sort"><h3>Respuestas</h3><select id="sort" aria-label="Ordenar respuestas"><option value="useful" ${s.sort==='useful'?'selected':''}>Más útiles</option><option value="new" ${s.sort==='new'?'selected':''}>Nuevas</option></select></div>${rs.length?rs.map(r=>reply(r,0,top)).join(''):'<p>Tu experiencia puede ayudar. Comparte la primera respuesta.</p>'}</section><form id="reply-form" class="composer">${target?`<div class="context">Respondiendo a ${esc(target.who)}${btn('Cancelar','cancel-reply')}</div>`:''}<div class="compose-line"><textarea id="draft" aria-label="Tu respuesta" placeholder="Escribe una respuesta" maxlength="3000" required>${esc(s.drafts[p.id]||'')}</textarea><button type="submit" class="primary">Enviar</button></div><p class="hint">Demo: tu respuesta solo se guarda en este navegador.</p></form>`}
function render(){initMessages();const sc=app.querySelector('.scroll'),pos=sc?.scrollTop||0;app.className='app'+(s.large?' large':'')+(s.small?' small':'');app.innerHTML=s.member?memberScreen():s.dmChat?chatScreen():s.composePage?composeScreen():s.info?infoScreen():s.page?thread():feed();app.querySelector('.scroll').scrollTop=pos;document.querySelectorAll('[data-action=demo]').forEach(b=>b.setAttribute('aria-pressed',s.mode===b.dataset.mode));document.getElementById('size').setAttribute('aria-pressed',s.small);document.getElementById('text').setAttribute('aria-pressed',s.large);save()}
function findReply(id){const walk=rs=>{for(const r of rs){if(r.id===id)return r;const k=walk(r.kids||[]);if(k)return k}};for(const p of allPosts()){const r=walk(replies(p));if(r)return r}}

document.addEventListener('input',e=>{if(e.target.id==='draft'){s.drafts[s.page]=e.target.value;save()}if(e.target.closest('#post-form')){s.compose[e.target.name]=e.target.value;save()}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id);if(a==='demo'){s.mode=b.dataset.mode;s.page=s.mode==='thread'?1:null;if(s.mode==='return')s.read=false}if(a==='open'){s.page=id}if(a==='return-open'){s.page=1;s.read=true;s.folded={}}if(a==='back'||a==='home')s.page=null;if(a==='filter')s.filter=b.dataset.tag;if(a==='size')s.small=!s.small;if(a==='text')s.large=!s.large;if(a==='me')s.me[id]=!s.me[id];if(a==='vote')s.votes[id]=!s.votes[id];if(a==='fold')s.folded[id]=!s.folded[id];if(a==='reply')s.targets[s.page]={id,who:b.dataset.who};if(a==='cancel-reply')delete s.targets[s.page];if(a==='compose'){compose();return}if(a==='close'){dlg.close();save();return}if(a==='help'){dialog(`<h2>Un espacio para escucharnos</h2><p>Comparte desde tu experiencia, respeta los límites y evita publicar datos privados.</p><p>Las respuestas de otras participantes son experiencias personales, no asesoramiento profesional.</p><p class="meta">Esta demo no conecta con moderadoras. En la app final, este espacio debe incluir reportes y contacto con el equipo.</p>${btn('Cerrar','close','','primary')}`);return}if(a==='outside'){dialog(`<h2>${esc(b.dataset.name)}</h2><p>Esta sección está fuera de esta demo de Círculos.</p>${btn('Volver a Círculos','close','','primary')}`);return}if(a==='reset'){dialog(`<h2>¿Restablecer la demo?</h2><p>Se borrarán tus publicaciones, respuestas y borradores de esta demo en este navegador.</p><div class="dialog-actions">${btn('Cancelar','close')}${btn('Restablecer','confirm-reset','','primary')}</div>`);return}if(a==='confirm-reset'){s=blank();POSTS=JSON.parse(initialFixture);dlg.close();announce('Demo restablecida.')}render();if(['open','demo','filter','back','return-open'].includes(a))app.querySelector('.scroll').scrollTop=0;if(a==='reply'||a==='cancel-reply')document.getElementById('draft')?.focus()});
document.addEventListener('submit',e=>{if(e.target.id==='reply-form'){e.preventDefault();const txt=(s.drafts[s.page]||'').trim();if(!txt)return;const target=s.targets[s.page];const r={id:Date.now(),order:Date.now(),who:'Tú',ago:'ahora',useful:0,txt,kids:[]};if(target){const parent=findReply(target.id);if(!parent){announce('No se encontró la respuesta. Tu borrador sigue guardado.');return}parent.kids.push(r);s.folded[parent.id]=false;/* persist mutations of fixture replies separately */s.fixture=POSTS;}else(s.extra[s.page]??=[]).push(r);delete s.drafts[s.page];delete s.targets[s.page];render();document.getElementById('reply-'+r.id)?.scrollIntoView({block:'nearest'});announce('Respuesta guardada en la demo.');document.getElementById('draft').focus()}if(e.target.id==='post-form'){e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim(),body=f.get('body').trim();if(!title||!body)return;const p={id:Date.now(),t:title,body,short:body.slice(0,120),tag:f.get('tag'),who:'Tú',ago:'ahora',me:0,replies:[]};s.posts.unshift(p);s.compose={title:'',body:'',tag:'fam'};s.page=p.id;dlg.close();render();app.querySelector('.scroll').scrollTop=0;announce('Conversación guardada en la demo.')}});

function minutesAgo(p){if(p.ago==='ahora')return 0;const n=Number(p.ago.match(/\d+/)?.[0]||1);return p.ago.includes('min')?n:p.ago.includes('días')?n*1440:p.ago==='ayer'?1440:n*60}
function hub(){const recent=allPosts().filter(p=>s.joined.includes(p.circle||'money')).sort((a,b)=>minutesAgo(a)-minutesAgo(b)||b.id-a.id);return hubHeader()+`<section class="scroll hub-body">${s.hubTab==='discover'?`<h2>Encuentra tu círculo</h2>${Object.entries(CIRCLES).map(([k,c])=>`<article class="circle-discovery"><div class="circle-symbol">${circleArt(k)}</div><div><h3>${c.name}</h3><p>${c.desc}</p></div>${btn(s.joined.includes(k)?'Entrar':'Unirme',s.joined.includes(k)?'circle-open':'circle-join',`data-circle="${k}"`,s.joined.includes(k)?'':'primary')}</article>`).join('')}`:`<div class="circle-strip" aria-label="Círculos a los que perteneces">${s.joined.map(k=>btn(circleArt(k)+esc(CIRCLES[k].name),'circle-open',`data-circle="${k}"`,'topic-'+k)).join('')}${btn('Descubrir +','hub-tab','data-tab="discover"')}</div>${s.joined.includes('money')&&!s.read?`<div class="personal-news">${btn(avatar('Lucía')+'Lucía te respondió · ver respuesta','new-reply')}<span>Ejemplo</span></div>`:''}<div class="feed-heading"><h2>Conversaciones recientes</h2><span>Más nuevas</span></div>${recent.length?recent.map(p=>row(p,true)).join(''):`<p class="empty">Únete a un círculo para ver sus conversaciones.</p>${btn('Descubrir círculos','hub-tab','data-tab="discover"','primary')}`}`}</section>`+bottomNav()}

function composeScreen(){const c=s.compose;const dest=c.circle||'';return `<div class="bar">${btn('Volver','compose-back')}<strong>Nueva publicación</strong>${btn('Guardar','compose-back')}</div><section class="scroll compose-screen"><form id="community-post"><label for="community-body">¿Qué te está pasando o qué estás intentando resolver?</label><textarea id="community-body" name="body" maxlength="3000" required placeholder="Cuéntalo con tus palabras. La primera frase será el título.">${esc(c.body||'')}</textarea><label for="community-circle">Dónde se publica</label><select id="community-circle" name="circle" required><option value="" disabled ${dest?'':'selected'}>Elige dónde publicar</option>${s.joined.map(k=>`<option value="${k}" ${dest===k?'selected':''}>${CIRCLES[k].name}</option>`).join('')}</select><fieldset><legend>Cómo apareces</legend><label><input type="radio" name="identity" value="named" ${c.anonymous?'':'checked'}> Con mi nombre (Sofía)</label><label><input type="radio" name="identity" value="anonymous" ${c.anonymous?'checked':''}> Anónima</label></fieldset><p class="privacy">${c.anonymous?'La publicación aparecerá como «Anónima».':'Las demás verán el nombre Sofía.'} En esta demo no se publica fuera de tu navegador.</p><p class="privacy">Tus chats con Elara y tus respuestas personales no se comparten aquí. Solo se comparte lo que tú escribas en esta publicación.</p></form></section><div class="bottom"><button form="community-post" type="submit" class="primary" ${dest&&s.joined.includes(dest)?'':'disabled'}>${dest?'Publicar en demo':'Elige un círculo para publicar'}</button></div>`}
function infoScreen(){return `<div class="bar">${btn('Volver','info-back')}<strong>${s.info==='rules'?'Normas del círculo':'Ajustes del círculo'}</strong></div><section class="scroll info-screen"><h2>${circle().name}</h2>${s.info==='rules'?'<p>Habla desde tu experiencia. Escucha sin juzgar y respeta que otras mujeres puedan elegir algo distinto.</p><p>No compartas información privada de otra persona ni hagas promociones. Las experiencias del círculo no sustituyen asesoramiento profesional.</p><p class="meta">Demo: la moderación y el sistema de reportes todavía no están conectados.</p>':`<p>Formas parte de este círculo. Puedes salir y volver a unirte cuando quieras.</p>${btn('Salir del círculo','circle-leave',`data-circle="${s.circle}"`,'outline')}<p class="meta">Esta opción solo cambia tu membresía en esta demo local.</p>`}</section>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;let handled=true;if(['hub-tab','hub-home','demo','circle-open','new-reply'].includes(a)){s.member=null;s.dmChat=null}
 if(a==='hub-tab'){s.hub=true;s.page=null;s.hubTab=b.dataset.tab;s.info=null}

},true);

function initMessages(){s.connections??={'Lucía':'connected'};s.chats??={'Lucía':{status:'accepted',messages:[{from:'them',text:'Gracias por compartir tu experiencia en el círculo. Me ayudó mucho leerte.',time:'Ayer'}]}};s.dmDrafts??={};s.inboxMode??='chats';s.blocked??={}}
function commonCircles(name){return [...new Set(allPosts().filter(p=>p.who===name||replies(p).some(r=>r.who===name)).map(p=>p.circle||'money'))].filter(k=>s.joined.includes(k))}
function memberNames(){const names=new Set();for(const p of allPosts()){names.add(p.who);const walk=rs=>rs.forEach(r=>{names.add(r.who);walk(r.kids||[])});walk(replies(p))}return [...names].filter(canContact)}
function openChat(name){s.member=null;s.dmChat=name;s.hub=true;s.hubTab='messages';s.inboxMode='chats';s.chats[name]??={status:s.connections[name]==='connected'?'accepted':'request',messages:[]}}
function memberScreen(){initMessages();const name=s.member,status=s.connections[name],shared=commonCircles(name),blocked=s.blocked[name];return `<div class="bar">${btn('Volver','member-back')}<strong>Perfil</strong>${btn('Ayuda','help')}</div><section class="scroll member-screen"><div class="member-hero">${avatar(name)}<h1>${esc(name)}</h1><p>Perfil de ejemplo · Círculos de Elara</p></div><div class="member-buttons">${btn(icon('chat-circle')+'Mensaje','dm-open',`data-name="${esc(name)}" ${blocked?'disabled':''}`,'primary')}${btn(status==='connected'?'Conectadas':status==='pending'?'Solicitud enviada':'Conectar','connect',`data-name="${esc(name)}" aria-pressed="${status==='connected'||status==='pending'}"`,'outline')}</div>${status==='pending'?'<p class="mini-note">Solicitud guardada en la demo. Puedes cancelarla tocando «Solicitud enviada».</p>':''}<h2>Círculos en común</h2>${shared.length?shared.map(k=>`<div class="shared-circle">${esc(CIRCLES[k].name)}</div>`).join(''):'<p class="meta">Participante de la comunidad.</p>'}<p class="mini-note">Las conexiones y los mensajes de esta demo solo existen en tu navegador.</p><div class="profile-settings">${btn(blocked?'Desbloquear mensajes':'Bloquear mensajes','dm-block',`data-name="${esc(name)}"`)}</div></section>`}
function inboxScreen(){initMessages();const names=s.inboxMode==='new'?memberNames():s.inboxMode==='connections'?Object.keys(s.connections):Object.keys(s.chats).sort((a,b)=>(s.chats[b].updated||0)-(s.chats[a].updated||0));return hubHeader()+`<section class="scroll inbox-screen"><div class="inbox-tabs">${btn('Chats','inbox-tab','data-tab="chats" aria-pressed="'+(s.inboxMode==='chats')+'"')}${btn('Conexiones','inbox-tab','data-tab="connections" aria-pressed="'+(s.inboxMode==='connections')+'"')}</div>${s.inboxMode==='new'?'<h2>Nuevo mensaje</h2><p class="mini-note">Elige a alguien de tus círculos.</p>':''}${names.length?names.map(name=>{const c=s.chats[name],last=c?.messages.at(-1),pending=s.connections[name]==='pending';return `<button class="chat-row" data-action="${s.inboxMode==='connections'?'member':'dm-open'}" data-name="${esc(name)}">${avatar(name)}<span><strong>${esc(name)}</strong><span class="chat-preview">${s.inboxMode==='connections'?(pending?'Conexión solicitada':'Conectadas'):last?esc((last.from==='me'?'Tú: ':'')+last.text):'Inicia una conversación'}</span></span>${s.blocked[name]?'<small>Bloqueada</small>':c?.status==='request'&&c.messages.length?'<small>Solicitud</small>':''}</button>`}).join(''):'<div class="empty"><h2>Aún no hay conexiones</h2><p>Abre el perfil de una mujer del círculo y toca «Conectar».</p></div>'}<p class="mini-note">Demo con mensajes de ejemplo. No se envía nada a otras personas.</p></section>`+bottomNav()}
function chatScreen(){initMessages();const name=s.dmChat,c=s.chats[name],blocked=s.blocked[name],pending=c.status==='request',waiting=pending&&c.messages.length>0;return `<div class="bar chat-bar">${btn('Volver','dm-back')}${btn(avatar(name)+`<strong>${esc(name)}</strong>`,'member',`data-name="${esc(name)}"`,'chat-person')}${btn(blocked?'Desbloquear':'Bloquear','dm-block',`data-name="${esc(name)}"`)}</div><section class="scroll chat-scroll"><div class="chat-explainer">${pending?'Tu primer mensaje se enviaría como solicitud. Ella decide si quiere responder.':'Conversación privada de ejemplo.'}</div>${c.messages.map(m=>`<div class="message ${m.from==='me'?'outgoing':'incoming'}"><p>${esc(m.text)}</p><small>${esc(m.time)}${m.from==='me'?' · Demo':''}</small></div>`).join('')}${pending&&c.messages.length?'<p class="request-state">Solicitud guardada · pendiente de respuesta en la demo.</p>':''}</section><form id="dm-form" class="composer"><div class="compose-line"><textarea id="dm-draft" aria-label="Mensaje privado" placeholder="Escribe un mensaje privado" maxlength="2000" required ${blocked||waiting?'disabled':''}>${esc(s.dmDrafts[name]||'')}</textarea><button type="submit" class="primary" ${blocked||waiting?'disabled':''}>${waiting?'Pendiente':pending?'Solicitar':'Enviar'}</button></div><p class="hint">${blocked?'Mensajes bloqueados en esta demo.':'Solo en este navegador. No se envía a nadie.'}</p></form>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,name=b.dataset.name;const acts=['member','member-back','connect','dm-open','dm-back','dm-new','inbox-tab','dm-block'];if(!acts.includes(a))return;e.preventDefault();e.stopImmediatePropagation();initMessages();if(a==='member'&&canContact(name)){s.member=name}if(a==='member-back'){s.member=null}if(a==='connect'){if(s.connections[name]==='pending'){delete s.connections[name];announce('Solicitud cancelada en la demo.')}else if(s.connections[name]!=='connected'){s.connections[name]='pending';announce('Solicitud de conexión guardada en la demo.')}}if(a==='dm-open'&&!s.blocked[name])openChat(name);if(a==='dm-back'){s.dmChat=null;s.hub=true;s.hubTab='messages'}if(a==='dm-new'){s.member=null;s.dmChat=null;s.hub=true;s.hubTab='messages';s.inboxMode='new'}if(a==='inbox-tab')s.inboxMode=b.dataset.tab;if(a==='dm-block'){s.blocked[name]=!s.blocked[name];announce(s.blocked[name]?'Mensajes bloqueados en la demo.':'Mensajes desbloqueados en la demo.')}render();const sc=app.querySelector('.scroll');sc.scrollTop=s.dmChat?sc.scrollHeight:0},true);
document.addEventListener('input',e=>{if(e.target.id==='dm-draft'){s.dmDrafts[s.dmChat]=e.target.value;save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='dm-form')return;e.preventDefault();e.stopImmediatePropagation();initMessages();const name=s.dmChat,txt=(s.dmDrafts[name]||'').trim();if(!txt||s.blocked[name]||(s.chats[name].status==='request'&&s.chats[name].messages.length))return;s.chats[name].messages.push({from:'me',text:txt,time:'Ahora'});s.chats[name].updated=Date.now();delete s.dmDrafts[name];render();app.querySelector('.scroll').scrollTop=app.querySelector('.scroll').scrollHeight;if(!document.getElementById('dm-draft').disabled)document.getElementById('dm-draft').focus();announce('Mensaje guardado en la demo. No se envió a nadie.')},true);
initMessages();
if(s.compactRevision!==1){s.large=false;s.compactRevision=1}
render();
</script></body></html>
