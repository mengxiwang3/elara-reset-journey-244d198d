<rect x="-10" y="-10" width="120" height="120" fill="#fff"/>
<path d="M8 71 C27 64 41 77 60 73 C75 70 84 72 92 68" fill="none" stroke="#000" stroke-width="23.5" stroke-linecap="round"/></mask></defs><circle cx="60" cy="45" r="22" fill="currentColor" mask="url(#bm)"/>
<path d="M8 71 C27 64 41 77 60 73 C75 70 84 72 92 68" fill="none" stroke="currentColor" stroke-width="10.5" stroke-linecap="round"/></svg>