<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Elara"><title>Elara</title>
<!-- Option A · Sun and land. The colour mark's sun, resting on its first horizon (the horizon trims its base, as the hills do in colour), and the land below that horizon, inside the orb's circle. One gap parts them. One ink: #F7F1E8. -->
<defs><clipPath id="ao"><circle cx="50" cy="50" r="50"/></clipPath>
<mask id="am" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
<rect x="-10" y="-10" width="120" height="120" fill="#000"/>
<circle cx="60" cy="45" r="22" fill="#fff"/>
<path d="M-4 63.5 C22 52 38 72 60 66 C78 61 90 66 104 59.5 V104 H-4 Z" fill="#000"/>
<path d="M-4 63.5 C22 52 38 72 60 66 C78 61 90 66 104 59.5 V104 H-4 Z" transform="translate(0 6)" fill="#fff"/></mask></defs><g clip-path="url(#ao)"><rect width="100" height="100" fill="#F7F1E8" mask="url(#am)"/></g></svg>