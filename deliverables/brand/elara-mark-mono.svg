<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Elara">
  <title>Elara</title>
  <defs>
    <clipPath id="orb"><circle cx="50" cy="50" r="50"/></clipPath>
    <!-- One carved sweep (the cream crescent) and one wave line; the rest is solid. -->
    <mask id="cut">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M8 26 C18 6 44 0 64 8 C46 8 32 20 30 38 C28 52 36 62 48 66 C30 68 12 60 6 46 C3 39 4 32 8 26 Z" fill="#000"/>
      <path d="M-2 74 C24 62 46 84 70 76 C84 71 94 72 102 68" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    </mask>
