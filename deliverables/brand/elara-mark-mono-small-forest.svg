<svg color="#1F3A2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Elara">
  <title>Elara</title>
  <!-- 24 px and under: one hill band and a heavier rim, so nothing closes up.
       The colour mark's own shapes in one ink: the rim of the orb, the sun, and
       the two hill bands, parted by even gaps; the cream sky is open paper. -->
  <defs>
    <clipPath id="orb"><circle cx="50" cy="50" r="50"/></clipPath>
    <mask id="cut">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="44" fill="#000"/>
      <circle cx="60" cy="44" r="20" fill="#fff"/>
      <path d="M-2 65 C22 53 38 73 60 67 C78 62 90 67 102 60" fill="none" stroke="#000" stroke-width="13"/>
      <path d="M-2 63 C22 51 38 71 60 65 C78 60 90 65 102 58 V102 H-2 Z" fill="#fff"/>
    </mask>
  </defs>
  <g clip-path="url(#orb)"><rect width="100" height="100" fill="currentColor" mask="url(#cut)"/></g>
</svg>
