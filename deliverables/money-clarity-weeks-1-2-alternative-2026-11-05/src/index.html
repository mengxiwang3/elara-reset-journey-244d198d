<title>Claridad · Semanas 1 y 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>

/* Layout: a working phone beside a review panel; two more views lay out a day's screens and the design review. */
:root{
  /* page chrome: follows the viewer's theme */
  --bg:#F2F4F1; --surface:#FFFFFF; --fg:#1A1615; --muted:#5A615C; --line:#DCE1DC; --chip:#E7EBE6; --accent:#1F3A2E; --accent-fg:#F7F1E8; --dot:#26314D;
  /* Elara (from @elara/tokens): the same in both themes, it is the product's own look */
  --paper:#F9F5EF; --mount:#FBF7EE; --slip:#FFFDF9; --sand:#EFE4D2; --hair:#E2E6E3; --rule:#C9D0CB;
  --ink:#1E2430; --ink2:#4A5160; --body:#2C3240; --placeholder:#6B7280;
  --forest:#1F3A2E; --forest2:#16382A; --forestDeep:#122E23; --cream:#F7F1E8; --mint:#A3E5C7; --mintPale:#E8F5EE;
  --ember:#C94A1C; --emberDark:#B8441A; --peach:#FFF1EC; --peachLine:#E8CDBE;
  --navy:#26314D; --pencil:#9A9089; --return:#EEF1E8;
  /* clean white panels over the landscape; a faint green tint, never beige */
  --white:rgba(255,255,255,.9); --tint:#F1F5F2; --line2:rgba(26,22,21,.12); --mist:#DFE7E2;
  /* Ventana's warm sans for everything */
  --serif:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --sans:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .3 0 0 0 0 .24 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1814; --surface:#15211C; --fg:#F1ECE4; --muted:#B4ACA2; --line:#293832; --chip:#1D2B25; --accent:#E9DFD0; --accent-fg:#14211B; --dot:#C9D2E6; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0F1814; --surface:#15211C; --fg:#F1ECE4; --muted:#B4ACA2; --line:#293832; --chip:#1D2B25; --accent:#E9DFD0; --accent-fg:#14211B; --dot:#C9D2E6; color-scheme:dark }

body{background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.5}
.page{max-width:1260px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 48px; display:flex; flex-direction:column; gap:22px}
.ph{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}
.ph > div:first-child{min-width:0; max-width:660px}
.kicker{margin:0; font-size:13px; font-weight:600; color:var(--muted)}
.ptitle{margin:4px 0 0; font-family:var(--serif); font-size:clamp(30px, 4.4vw, 42px); line-height:1.08; font-weight:800; letter-spacing:-.025em; text-wrap:balance}
.psub{margin:10px 0 0; color:var(--muted); max-width:64ch}
.seg{display:flex; flex-wrap:wrap; background:var(--chip); border-radius:999px; padding:4px; gap:4px}
.seg button{min-height:40px; border:0; border-radius:999px; padding:0 14px; background:transparent; color:var(--fg); font:600 14px var(--sans); cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent); color:var(--accent-fg)}
.langbar{display:flex; justify-content:flex-end; margin-bottom:8px}
.langbar .seg button{min-height:34px; font-size:13px}
button:focus-visible, textarea:focus-visible, summary:focus-visible, input:focus-visible{outline:3px solid #D9773F; outline-offset:2px}

.try{display:grid; grid-template-columns:auto minmax(0, 360px); gap:28px; align-items:start; justify-content:center}
.device{--sw:390px; --sh:844px; padding:10px; border-radius:50px; background:#1B1714; box-shadow:0 30px 60px -26px rgba(26,22,21,.5)}
.device.small{--sw:375px; --sh:667px}
.screen{width:var(--sw); height:var(--sh); border-radius:40px; overflow:hidden; position:relative; isolation:isolate; background:#DFE7E2}
.panel{position:sticky; top:16px; display:flex; flex-direction:column; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px}
.panel h2{margin:0; font-size:14px; font-weight:700; color:var(--fg)}
.cbox{display:flex; flex-direction:column; gap:10px}
.nowlabel{margin:0; font-size:14px; background:var(--chip); border-radius:12px; padding:10px 12px}
.ctext{width:100%; box-sizing:border-box; min-height:96px; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--bg); color:var(--fg); font:500 15px/1.45 var(--sans); resize:vertical}
.ctext::placeholder{color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{position:relative; min-width:44px; min-height:44px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--fg); font:700 15px var(--sans); cursor:pointer; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.prow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pbtn{min-height:44px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:transparent; color:var(--fg); font:600 14px var(--sans); cursor:pointer}
.pbtn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.pbtn:disabled{opacity:.45; cursor:default}
.toggles{display:flex; flex-direction:column; gap:0; border:0; margin:0; padding:0}
.toggles label, .hl{display:flex; align-items:center; gap:10px; min-height:40px; font-size:14px; cursor:pointer}
.toggles input, .hl input{width:20px; height:20px; accent-color:var(--accent); margin:0; flex:none}
.fine{margin:0; font-size:13px; color:var(--muted); line-height:1.5}
.fine b{color:var(--fg); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{display:inline-block; width:14px; height:12px; border-radius:3px}
.more{border-top:1px solid var(--line); padding-top:10px}
.more summary{min-height:36px; display:flex; align-items:center; font-size:14px; font-weight:700; cursor:pointer}
.declist{margin:6px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:12px; font-size:14px}
.declist li{display:flex; flex-direction:column; gap:6px}
.declist .ctext{min-height:64px}
.chlist{margin:6px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:8px; font-size:13px; color:var(--muted)}
.chlist b{color:var(--fg)}

.all, .rev{display:flex; flex-direction:column; gap:18px}
.allhead{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px}
.allhead p{margin:0; color:var(--muted); font-size:14px; max-width:70ch}
.strip{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:30px 18px; align-items:start}
.snapfig{margin:0; display:flex; flex-direction:column; gap:8px; min-width:0}
.snap{border-radius:22px; overflow:hidden; box-shadow:0 14px 30px -20px rgba(26,22,21,.55); width:max-content; max-width:100%; background:#DFE7E2}
.snapin{zoom:.62}
.snapfig figcaption{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; font-size:13px; font-weight:600}
.snapfig figcaption small{display:block; font-weight:400; color:var(--muted); margin-top:2px}
.snapfig figcaption button{min-height:36px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--fg); font:600 12px var(--sans); padding:0 10px; cursor:pointer; white-space:nowrap; flex:none}
.revtext{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:18px}
.revcard{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 20px; display:flex; flex-direction:column; gap:10px; min-width:0}
.revcard h3{margin:0; font-family:var(--serif); font-size:20px; font-weight:800; letter-spacing:-.015em; line-height:1.2}
.revcard p, .revcard li{margin:0; font-size:14px; line-height:1.55; color:var(--fg)}
.revcard ul, .revcard ol{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px}
.revcard .muted{color:var(--muted)}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th, .tbl td{text-align:left; vertical-align:top; padding:8px 8px 8px 0; border-top:1px solid var(--line)}
.tbl th{font-weight:700; color:var(--muted); font-size:12px}
.tblwrap{overflow-x:auto}

@media (max-width: 880px){ .try{grid-template-columns:minmax(0,1fr)} .panel{position:static} }
@media (max-width: 560px){
  .device{padding:0; background:none; box-shadow:none; border-radius:0}
  .device .screen{width:100%; height:720px; height:clamp(560px, calc(100svh - 24px), 780px); border-radius:22px}
  .device.small .screen{height:667px}
  .strip{grid-template-columns:minmax(0,1fr); justify-items:center}
  .snapin{zoom:.86}
}

/* ================= Elara ================= */
.app{--u:1px; --tabh:78px; --top:50px; --band:168px; position:absolute; inset:0; overflow:hidden; color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; background:linear-gradient(var(--mist), #EEF2EF); text-align:left}
.bgblur{position:absolute; inset:-60px; background-size:cover; background-position:center; filter:blur(34px) saturate(1.1); z-index:0}
.veil{position:absolute; inset:0; background:linear-gradient(rgba(255,255,255,0) 35%, rgba(255,255,255,.3)); z-index:0}
.nophoto .bgblur{display:none}
.app.big{--u:1.25px}
.app.small{--tabh:66px; --top:24px; --band:128px}
.app *{box-sizing:border-box}
.app p, .app h1, .app h2, .app ol, .app ul{margin:0}
.app button{font-family:inherit; color:inherit; -webkit-tap-highlight-color:transparent}
.app img.broken{visibility:hidden}

/* the place, with a little life in it: the water ripples, the mist drifts, the photo breathes */
.heroBox{position:absolute; left:0; top:0; width:100%; height:66%; overflow:hidden; z-index:0; -webkit-mask-image:linear-gradient(#000 72%, transparent); mask-image:linear-gradient(#000 72%, transparent)}
.app.small .heroBox{height:56%}
.heroInner{position:absolute; inset:0; transform-origin:50% 62%; animation:breathe 38s ease-in-out infinite alternate}
.hero{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.water{filter:url(#ripple); -webkit-mask-image:linear-gradient(transparent calc(var(--water) * 100%), #000 calc(var(--water) * 100% + 6%)); mask-image:linear-gradient(transparent calc(var(--water) * 100%), #000 calc(var(--water) * 100% + 6%))}
.mist{position:absolute; left:-25%; right:-25%; top:0; height:calc(var(--water) * 100%); pointer-events:none; opacity:.5; mix-blend-mode:screen; filter:blur(10px);
  background:radial-gradient(38% 55% at 28% 55%, rgba(255,255,255,.75), transparent 72%), radial-gradient(30% 45% at 70% 40%, rgba(255,255,255,.6), transparent 72%), radial-gradient(26% 40% at 50% 80%, rgba(255,255,255,.5), transparent 70%);
  animation:drift 52s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.02)} to{transform:scale(1.07) translateX(-1.2%)}}
@keyframes drift{from{transform:translateX(-7%)} to{transform:translateX(7%)}}
@media (prefers-reduced-motion: reduce){ .heroInner, .mist{animation:none} .water{display:none} }
.snapapp .heroInner, .snapapp .mist{animation:none}
.snapapp .water{display:none}
.nophoto .heroBox, .nophoto .band img{display:none}
.heroFallback{position:absolute; left:0; top:0; width:100%; height:58%; background:linear-gradient(#CFDCD5, var(--mist)); z-index:0; display:none}
.nophoto .heroFallback{display:block}
.home .scroll, .plain .scroll{position:absolute; left:0; right:0; top:0; bottom:var(--tabh); overflow-y:auto; z-index:1}
.col{min-height:100%; display:flex; flex-direction:column}
.spacer{flex:1 0 auto; min-height:190px; display:flex; flex-direction:column; justify-content:flex-start; padding:var(--top) 16px 40px}
.app.small .spacer{min-height:130px}
.hdr{display:flex; align-items:center; justify-content:space-between; gap:8px}
.hbtns{display:flex; gap:8px; flex:none}
.disc{flex:none; width:44px; height:44px; border-radius:50%; border:1px solid rgba(26,22,21,.06); background:rgba(255,255,255,.92); display:grid; place-items:center; font-family:var(--serif); font-weight:600; font-size:20px; cursor:pointer; color:var(--ink); box-shadow:0 2px 6px rgba(26,22,21,.12)}
.place{margin:0; min-width:0; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:4px 14px 4px 10px; border-radius:18px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); font-size:calc(14*var(--u)); line-height:1.3; font-weight:600; color:var(--ink)}
.place svg{flex:none}
.nophoto .place{background:var(--slip)}

/* the notebook page laid over the place */
.page2{position:relative; margin:-34px 12px 12px; border-radius:28px; background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(24px) saturate(1.3); backdrop-filter:blur(24px) saturate(1.3); padding:18px 20px 6px; display:flex; flex-direction:column}
.stack{display:flex; flex-direction:column; gap:12px; margin-top:8px; padding-bottom:12px}
.thread{align-self:flex-start; display:flex; align-items:center; min-height:44px; margin:-8px 0 0 -2px; padding:0 2px; border:0; background:none; cursor:pointer}
.tn{flex:none; width:12px; height:12px; border-radius:50%; position:relative}
.tn.w{background:var(--forest)}
.tn.now{background:#fff; box-shadow:inset 0 0 0 2px var(--forest)}
.tn.now::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--ember)}
.tn.a{border:1.5px solid #C3CBC6}
.tl{flex:none; width:16px; height:2px}
.tl.w{background:var(--forest)}
.tl.a{background:#D3DAD5}
.threadlab{margin-left:10px; font-size:calc(12*var(--u)); font-weight:600; color:var(--ink2)}
.eyebrow{font-size:calc(13*var(--u)); line-height:1.4; font-weight:600; color:var(--ink2)}
.eyebrow.done{display:flex; align-items:center; gap:8px; color:var(--forest)}
.tick{flex:none; display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--forest); color:var(--cream)}
.title{margin-top:6px !important; font-family:var(--serif); font-size:calc(26*var(--u)); line-height:1.2; font-weight:800; letter-spacing:-.02em; color:var(--ink); text-wrap:balance}
.title:focus, .h2:focus{outline:none}
.label{font-size:calc(12*var(--u)); line-height:1.35; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2)}
.purpose{margin-top:12px !important; font-size:calc(16*var(--u)); line-height:1.4; font-weight:500; color:var(--body)}
.purpose .label{display:block; margin-bottom:3px}
/* the quiet Ventana row: what she kept, and the way to Atlas */
.rrow{margin-top:10px; width:100%; border:0; border-top:1px solid rgba(30,36,48,.12); background:none; padding:12px 0; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer; color:var(--ink)}
.rico{flex:none; display:grid; place-items:center; width:36px; height:36px; border-radius:10px; background:rgba(31,58,46,.08); color:var(--forest)}
.rcol{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.rtop{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.rlink{font-size:calc(13*var(--u)); line-height:1.3; font-weight:700}
.rlink.lg{font-size:calc(15*var(--u))}
.rq{font-size:calc(14.5*var(--u)); line-height:1.45; font-weight:500; color:var(--ink)}
.kblock{margin-top:12px; display:flex; flex-direction:column; gap:3px}
.quote{font-size:calc(17*var(--u)); line-height:1.4; font-weight:600; color:var(--ink)}
.meta{display:flex; align-items:flex-start; gap:6px; margin-top:10px !important; font-size:calc(13*var(--u)); line-height:1.4; color:var(--ink2)}
.meta svg{flex:none; margin-top:calc(2*var(--u))}
.btn{width:100%; min-height:54px; border:0; border-radius:27px; background:var(--forest); color:var(--cream) !important; font-size:calc(17*var(--u)); line-height:1.25; font-weight:600; padding:12px 20px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer}
.btn:disabled{background:#D6CEC4; color:#fff !important; cursor:default}
.btn.ember{background:var(--emberDark)}
.btn2{min-height:50px; border:1.5px solid var(--rule); border-radius:25px; background:transparent; font-size:calc(16*var(--u)); font-weight:600; padding:10px 18px; cursor:pointer; color:var(--ink)}
.mt14{margin-top:14px !important} .mt10{margin-top:10px !important}
.link{align-self:flex-start; min-height:44px; border:0; background:none; padding:0; display:inline-flex; align-items:center; gap:6px; font-size:calc(14.5*var(--u)); line-height:1.3; font-weight:600; text-align:left; cursor:pointer; color:var(--ink)}
.link.u span{text-decoration:underline; text-decoration-color:var(--rule); text-decoration-thickness:1.5px; text-underline-offset:4px}
.links{display:flex; flex-wrap:wrap; gap:0 20px; align-items:center}

/* something she chose to keep: a clean card with a green bookmark */
.slip{position:relative; margin-top:14px; width:100%; display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--tint); border:0; border-radius:16px; padding:14px 14px 8px; cursor:pointer; color:var(--ink)}
.slip .kic{flex:none; width:32px; height:32px; border-radius:10px; background:#fff; color:var(--forest); display:grid; place-items:center; margin-top:2px}
.slip .kb{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; padding-bottom:6px}
.slip .label{color:var(--ink2)}
.kept{font-family:var(--serif); font-size:calc(17.5*var(--u)); line-height:1.42; font-weight:450; color:var(--ink)}
.slip .go{align-self:flex-end; min-height:36px; display:inline-flex; align-items:center; font-size:calc(13.5*var(--u)); font-weight:600; color:var(--ink)}
div.slip{cursor:default}
.slip.today{background:#EAF3EE}
.daysrow{margin-top:8px; border:0; border-top:1px solid var(--hair); background:none; width:100%; min-height:48px; padding:6px 0 0; display:flex; align-items:center; justify-content:space-between; font-size:calc(15*var(--u)); font-weight:600; cursor:pointer; color:var(--ink)}
.voice{font-size:calc(16*var(--u)); line-height:1.5; color:var(--body)}
.voice.it{font-family:var(--serif); font-style:italic; font-size:calc(17*var(--u)); line-height:1.45; font-weight:420; color:var(--ink)}
.returnnote{margin-bottom:12px; background:var(--return); border-radius:14px; padding:12px 14px}
.welcome{margin-top:12px; display:flex; align-items:center; gap:12px; width:100%; min-height:56px; border:0; border-top:1px solid rgba(30,36,48,.12); border-radius:0; background:none; padding:12px 0; text-align:left; cursor:pointer; color:var(--ink)}
.welcome .playdisc{flex:none; width:40px; height:40px; border-radius:50%; background:var(--forest); color:var(--cream); display:grid; place-items:center}
.welcome span.t{display:flex; flex-direction:column; gap:1px}
.welcome b{font-weight:700; font-size:calc(16*var(--u)); line-height:1.25}
.tabs{position:absolute; left:0; right:0; bottom:0; height:var(--tabh); background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:1px solid rgba(26,22,21,.08); display:flex; justify-content:space-around; padding:6px 12px 0; z-index:3}
.tabs button{width:100px; min-height:50px; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:calc(13*var(--u)); font-weight:500; color:var(--ink2); cursor:pointer}
.tabs button[aria-current="page"]{color:var(--forest); font-weight:700}

/* the day's practice */
.sess{position:absolute; inset:0; display:flex; flex-direction:column}
.sess .scroll{position:relative; flex:1; min-height:0; overflow-y:auto; z-index:1}
.band{position:relative; height:var(--band); background:var(--mist)}
.band img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.bandbar{position:absolute; left:12px; right:12px; top:calc(var(--top) - 8px); display:flex; align-items:center; gap:10px}
.moments{height:36px; padding:0 12px; border-radius:18px; background:rgba(255,253,249,.94); display:flex; align-items:center; gap:10px; font-size:calc(13*var(--u)); font-weight:600; color:var(--ink); white-space:nowrap; box-shadow:0 1px 4px rgba(26,22,21,.12)}
.moments .tl{width:12px}
.moments .tn{width:10px; height:10px}
.moments .tn.now::after{inset:2.5px}
.sheet{position:relative; margin-top:-24px; border-radius:24px 24px 0 0; background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); padding:22px 20px 28px; min-height:calc(100% - var(--band) + 24px); display:flex; flex-direction:column; gap:16px}
.h2{font-family:var(--serif); font-size:calc(22*var(--u)); line-height:1.25; font-weight:800; letter-spacing:-.015em; color:var(--ink); text-wrap:balance}
.q{font-size:calc(18*var(--u)); line-height:1.4; font-weight:600; color:var(--ink); text-wrap:pretty}
.read{font-size:calc(18*var(--u)); line-height:1.6; color:var(--body); text-wrap:pretty}
.read.sm{font-size:calc(16*var(--u)); line-height:1.55}
.hint{font-size:calc(14*var(--u)); line-height:1.5; color:var(--ink2)}
.yday{background:var(--tint); border:0; border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:3px}
.yday .voice{font-size:calc(16*var(--u))}
.opts{display:flex; flex-direction:column; gap:10px}
.optwrap{border:1px solid var(--line2); border-radius:16px; background:#fff; overflow:hidden}
.optwrap.sel{border:2px solid var(--forest); background:#F0F6F2}
.opt{width:100%; min-height:52px; border:0; background:none; text-align:left; padding:13px 14px; display:flex; gap:12px; align-items:flex-start; font-size:calc(16*var(--u)); line-height:1.4; font-weight:500; cursor:pointer; color:var(--ink)}
.radio{flex:none; width:20px; height:20px; margin-top:calc(1*var(--u)); border-radius:50%; border:2px solid #B4BCB7; background:#fff}
.sel .radio{border:6px solid var(--forest)}
.box{flex:none; width:22px; height:22px; margin-top:calc(1*var(--u)); border-radius:6px; border:2px solid #B4BCB7; display:grid; place-items:center; color:var(--cream); background:#fff}
.sel .box{background:var(--forest); border-color:var(--forest)}
.resp{padding:0 14px 14px 46px; display:flex; flex-direction:column; gap:6px}
.resp .voice{font-size:calc(16.5*var(--u))}
.passwrap{display:flex; flex-direction:column; gap:4px}
.passwrap .voice{background:var(--tint); border:0; border-radius:14px; padding:12px 14px; font-size:calc(16.5*var(--u))}
.rulebox{background:var(--tint); border:0; border-left:3px solid var(--forest); border-radius:6px 14px 14px 6px; padding:14px 16px; display:flex; flex-direction:column; gap:4px}
.ruletext{font-size:calc(18*var(--u)); line-height:1.4; font-weight:700; color:var(--ink)}
.ale{display:flex; align-items:center; gap:12px; min-height:56px; border:0; border-radius:14px; background:var(--tint); padding:8px 12px; width:100%; text-align:left; cursor:pointer}
.ale .playdisc{flex:none; width:40px; height:40px; border-radius:50%; background:var(--forest); color:var(--cream); display:grid; place-items:center}
.ale .t{display:flex; flex-direction:column; gap:1px; font-size:calc(14*var(--u)); color:var(--ink2)}
.ale b{font-size:calc(15.5*var(--u)); color:var(--ink); font-weight:600}
.discl{border-top:1px solid var(--hair)}
.discbtn{width:100%; min-height:52px; border:0; background:none; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:calc(16*var(--u)); font-weight:600; text-align:left; cursor:pointer; padding:0; color:var(--ink)}
.discl.open .discbtn svg{transform:rotate(180deg)}
.discbody{display:flex; flex-direction:column; gap:10px; padding-bottom:8px}
.notebox{border-top:1px solid var(--hair); padding-top:14px; display:flex; flex-direction:column; gap:8px}
.field{width:100%; min-height:92px; border:1.5px solid #918780; border-radius:14px; padding:12px 14px; font:500 calc(16*var(--u))/1.45 var(--sans); color:var(--ink); background:#fff; resize:vertical}
.field::placeholder{color:var(--placeholder)}
.actions{position:relative; z-index:2; flex:none; background:rgba(255,255,255,.96); border-top:1px solid rgba(26,22,21,.08); padding:12px 16px 16px; display:flex; flex-direction:column; gap:4px}
.app:not(.small) .actions{padding-bottom:28px}
.row2{display:flex; justify-content:space-between; gap:12px}
.row2b{display:flex; gap:10px}
.row2b .btn{flex:1}
.alert{border:2px solid #9B2C2C; background:#FFF5F3; color:#7A1F1F; border-radius:14px; padding:12px 14px; font-size:calc(15*var(--u)); font-weight:600}
.next{font-size:calc(14.5*var(--u)); line-height:1.45; color:var(--ink2)}

/* day complete: back over the place, the same whether or not she saved */
.dayend{position:absolute; inset:0; display:flex; flex-direction:column}
.dayend .scroll{position:relative; flex:1; min-height:0; overflow-y:auto; z-index:1}
.dayend .heroInner{animation:none}

/* Tus días, Círculos */
.plain{position:absolute; inset:0; background:linear-gradient(var(--mist), #EEF2EF)}
.pcard{border-radius:28px; background:var(--white); -webkit-backdrop-filter:blur(22px) saturate(1.2); backdrop-filter:blur(22px) saturate(1.2); box-shadow:0 12px 30px -20px rgba(16,28,22,.5); padding:18px; display:flex; flex-direction:column; gap:12px}
.pcol{min-height:100%; padding:var(--top) 16px 16px; display:flex; flex-direction:column; gap:12px}
.dlist{list-style:none; padding:0; display:flex; flex-direction:column}
.drow{display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--hair)}
.drow:first-child{border-top:0}
.thumb{flex:none; width:56px; height:56px; border-radius:10px; object-fit:cover; background:var(--mist)}
.dmain{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.dt{font-size:calc(16*var(--u)); line-height:1.3; font-weight:700; color:var(--ink)}
.dmain .kept{font-size:calc(16*var(--u))}
.tag{align-self:flex-start; font-size:calc(12.5*var(--u)); font-weight:600; border-radius:999px; padding:3px 10px; background:var(--tint); color:var(--ink2)}
.tag.today{background:var(--forest); color:var(--cream)}
.future .dt, .future .thumb{opacity:.55}
.mounted{margin:0; display:flex; flex-direction:column; gap:8px}
.mounted img{width:100%; aspect-ratio:3/1; object-fit:cover; border-radius:14px; background:var(--mist); display:block}
.mounted figcaption{font-size:calc(13*var(--u)); font-weight:600; color:var(--ink2); padding:0 4px}
.nophoto .mounted img{visibility:hidden}
.threadrow{display:flex; align-items:center; min-height:36px}

/* sheets */
.ovl{position:absolute; inset:0; background:rgba(26,22,21,.42); z-index:8; border:0; padding:0; width:100%; cursor:pointer}
.bsheet{position:absolute; left:0; right:0; bottom:0; z-index:9; background:#fff; border-radius:26px 26px 0 0; padding:10px 20px 26px; display:flex; flex-direction:column; gap:12px; max-height:86%; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.grab{align-self:center; width:40px; height:5px; border-radius:3px; background:var(--rule); margin-bottom:4px}
.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; min-height:56px; border:0; background:none; padding:0; text-align:left; cursor:pointer}
.switch .tr{flex:none; width:52px; height:32px; border-radius:16px; background:var(--rule); position:relative; transition:background .15s}
.switch .tr::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s}
.switch[aria-checked="true"] .tr{background:var(--forest)}
.switch[aria-checked="true"] .tr::after{left:23px}
.video{aspect-ratio:16/9; border-radius:14px; background:var(--forest2); color:var(--mintPale); display:grid; place-items:center; text-align:center; padding:16px; font-size:calc(14*var(--u))}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
mark.mk{color:inherit; border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
.mk-new{background:#CFEBDB; box-shadow:0 0 0 2px #CFEBDB}
.mk-chg{background:#FBE3A6; box-shadow:0 0 0 2px #FBE3A6}
ins.prop{text-decoration:none; background:#F8DCCB; box-shadow:0 0 0 2px #F8DCCB; border-radius:3px; color:inherit}

/* snapshots in the grids show their whole length */
.snapapp{position:relative; inset:auto; width:390px; height:844px}
.snapapp.small{width:375px; height:667px}
.snapapp.tall{height:auto; min-height:844px}
.snapapp.small.tall{min-height:667px}
.snapapp.tall .sess, .snapapp.tall .dayend{position:relative; inset:auto; min-height:inherit}
.snapapp.tall .sess .scroll, .snapapp.tall .dayend .scroll{overflow:visible; flex:none}
.snapapp.tall .plain{position:relative; min-height:inherit}
.snapapp.tall .plain .scroll{position:relative; bottom:auto; overflow:visible; padding-bottom:var(--tabh)}
.snapapp .sheet{min-height:0}
@media (prefers-reduced-motion: reduce){ .switch .tr, .switch .tr::after{transition:none} }
/* ===== round 8: the reference look, and the walker ===== */
.btn{background:var(--ink); color:#fff !important; font-weight:700}
.btn:disabled{background:#C9CDD3}
.tabs button[aria-current="page"]{color:var(--ink); font-weight:800}
.tabs button{width:130px}
.voice.it{font-family:var(--sans); font-style:normal; font-size:calc(16*var(--u)); font-weight:500; color:var(--ink)}
.kept{font-family:var(--sans)}
.place{background:#fff; font-weight:700; min-height:40px; padding:4px 16px 4px 12px; border-radius:20px; box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
.disc{background:#fff; border:0; box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
.moments{background:#fff}
.page2{background:rgba(255,255,255,.95)}
.heroBox{height:60%}
.app.small .heroBox{height:50%}
.band{height:calc(var(--band) + 64px); overflow:hidden}
.app.small .band{height:calc(var(--band) + 40px)}
.wk{position:absolute; z-index:1; width:var(--wks,44px); transform:translate(-50%,-100%); pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.band .wk{--wks:36px}
.wk svg{display:block; width:100%; height:auto; overflow:visible}
.wk .lg{transform-box:fill-box; transform-origin:50% 0}
.wk.moving .lg.l{animation:wkleg .45s ease-in-out infinite alternate}
.wk.moving .lg.r{animation:wkleg .45s ease-in-out infinite alternate-reverse}
@keyframes wkleg{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.wk .arm{transform-box:fill-box; transform-origin:50% 100%}
.wk.moving .arm.l{animation:wkarm .6s ease-in-out infinite alternate}
.wk.moving .arm.r{animation:wkarm .6s ease-in-out infinite alternate-reverse}
@keyframes wkarm{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.wk .pad{transform-box:view-box; transform-origin:20px 40px; animation:wkpad 2.8s ease-in-out infinite}
.wk.moving .pad{animation-duration:.9s}
@keyframes wkpad{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.wk.float svg{animation:wkbob 3.4s ease-in-out infinite}
@keyframes wkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
.wk.cheer svg{animation:wkhop .6s ease-out}
@keyframes wkhop{0%{transform:translateY(0)}35%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.spark{position:absolute; left:50%; top:35%; width:0; height:0}
.spark i{position:absolute; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:#fff; opacity:0; box-shadow:0 0 6px rgba(255,255,255,.95); animation:wkspark .9s ease-out forwards}
@keyframes wkspark{0%{opacity:1; transform:translate(0,0) scale(.5)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.ripple2{position:absolute; left:50%; bottom:-2px; width:10px; height:3px; margin-left:-5px; border-radius:50%; border:1.5px solid rgba(255,255,255,.9); opacity:0; animation:wkring 1.1s ease-out forwards}
@keyframes wkring{0%{opacity:.9; transform:scale(1)}100%{opacity:0; transform:scale(6,4)}}
.pinH{position:absolute; z-index:1; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; pointer-events:none}
.pinH span{padding:6px 12px; border-radius:999px; background:#fff; color:var(--ink); font-size:calc(13*var(--u)); line-height:1.3; font-weight:600; white-space:nowrap; box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.pinH i{display:block; width:1.5px; height:28px; background:#fff}
.pinH b{display:block; width:7px; height:7px; border-radius:50%; background:#fff; margin-top:-2px}
.swrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.sw{width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.swlab{font-size:13px; color:var(--muted); min-width:56px}
@media (prefers-reduced-motion: reduce){ .wk *, .wk svg{animation:none !important} .spark, .ripple2{display:none} }
.snapapp .wk *, .snapapp .wk svg{animation:none !important}
.snapapp .spark, .snapapp .ripple2{display:none}
.nophoto .wk, .nophoto .pinH{display:none}

.chk{margin-top:18px; padding-top:16px; border-top:1px solid var(--hair); display:flex; flex-direction:column; gap:10px}
.chk .h2{font-size:calc(19*var(--u))}
.strip7{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin:10px 0 4px}
.strip7 img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; display:block}
.madecard{border-radius:14px; background:var(--tint); padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.madecard .kv{font-size:calc(16*var(--u)); line-height:1.4; font-weight:600}
.madecard .chipbtn{align-self:flex-start}
.stmt{border-radius:14px; border:1.5px solid var(--rule); background:#fff; padding:10px; display:flex; flex-direction:column; gap:6px}
.sth{font-size:calc(12*var(--u)); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); padding:2px 4px}
.stl{min-height:48px; border:0; border-radius:10px; background:var(--tint); padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:2px 10px; text-align:left; cursor:pointer; color:var(--ink); font-family:var(--sans)}
.stl.on{background:#F0F6F2; box-shadow:inset 0 0 0 1.5px var(--forest)}
.stl .stk{font-weight:700; font-size:calc(15*var(--u))}
.stl .stv{font-weight:700; font-size:calc(15*var(--u)); text-align:right}
.stl .stm{grid-column:1 / -1; font-size:calc(14*var(--u)); line-height:1.4; color:var(--ink2)}
.stl.total{background:#26314D; color:#fff; cursor:default}
/* the week kit and practice lines */
.pract{font-size:calc(15*var(--u)); line-height:1.45; font-weight:600; color:var(--forest)}
.pract.sm{font-size:calc(13.5*var(--u)); margin-top:2px}
.kitlist{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.kit{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:start; padding:10px 12px; border-radius:12px; background:var(--tint)}
.kit .kd{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:700; color:var(--ink2); box-shadow:inset 0 0 0 1.5px #C3CBC6}
.kit.on .kd{background:var(--forest); color:#fff; box-shadow:none}
.kit .kl{font-size:calc(12*var(--u)); font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2)}
.kit .kv{font-size:calc(15*var(--u)); line-height:1.4; font-weight:600; color:var(--ink); margin-top:2px}
.kit .ke{font-size:calc(13.5*var(--u)); line-height:1.4; color:var(--ink2); margin-top:2px}
.kitlabels{margin:4px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:calc(15*var(--u)); font-weight:600}
/* before the week */
.topictag{display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:#EAF3EE; color:var(--forest); font-size:11.5px; font-weight:700; letter-spacing:.03em; vertical-align:1px}
.chipbtn:disabled{opacity:.45; cursor:default}
.chips.tight .chipbtn{min-height:44px; padding:7px 14px}
.nextweek{margin-top:16px; padding-top:14px; border-top:1px solid var(--hair); display:flex; flex-direction:column; gap:8px}
/* applied activities */
.act{margin-top:16px; padding-top:14px; border-top:1px solid var(--hair); display:flex; flex-direction:column; gap:10px; position:relative}
.act .task{font-weight:700; font-size:calc(17*var(--u)); line-height:1.3; color:var(--ink)}
.act .ahint{font-size:calc(13.5*var(--u)); line-height:1.4; color:var(--ink2)}
.act .agl{font-size:calc(12*var(--u)); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin-top:4px}
.ptag{align-self:flex-start; font-size:11.5px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:999px; background:#F8DCCB; color:#4A2410}
.notags .ptag{display:none}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips.col{flex-direction:column}
.chipbtn{min-height:44px; padding:9px 14px; border-radius:22px; border:1.5px solid var(--rule); background:#fff; font:600 calc(15*var(--u)) var(--sans); color:var(--ink); cursor:pointer; text-align:left; line-height:1.3}
.chips.col .chipbtn{border-radius:14px; width:100%}
.chipbtn.on{border-color:var(--forest); background:#F0F6F2; box-shadow:inset 0 0 0 1px var(--forest)}
.chipbtn.tall{display:flex; flex-direction:column; gap:2px}
.chipbtn.tall small{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2)}
.btn2.small{min-height:44px; font-size:calc(15*var(--u)); padding:8px 16px; align-self:flex-start}
.afb{padding:10px 12px; border-radius:12px; background:#EAF3EE; color:var(--ink); font-size:calc(14.5*var(--u)); line-height:1.45}
.afb.soft{background:#FFF3DF}
.tlrows,.brows{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.tlrow{display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 12px; border-radius:12px; background:var(--tint); font-size:calc(14*var(--u)); line-height:1.3}
.tlrow .when{font-weight:700; color:var(--ink2)}
.tlrow .bal{font-weight:700; text-align:right}
.tlrow.short{background:#FFF1EC; box-shadow:inset 0 0 0 1.5px #C94A1C}
.pairs{display:flex; flex-direction:column; gap:8px}
.pair{min-height:56px; padding:10px 14px; border-radius:14px; border:1.5px solid var(--rule); background:#fff; text-align:left; display:flex; flex-direction:column; gap:2px; cursor:pointer; color:var(--ink)}
.pair.on{border-color:var(--forest); background:#F0F6F2}
.pair .ptxt{font-weight:700; font-size:calc(15*var(--u)); line-height:1.3}
.pair .pval{font-size:calc(13.5*var(--u)); color:var(--ink2); line-height:1.35}
.brow{display:grid; grid-template-columns:56px minmax(0,1fr); grid-template-areas:"l b" "l t"; gap:2px 10px; align-items:center}
.brow .blab{grid-area:l; font-size:calc(12.5*var(--u)); font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em}
.brow .bbar{grid-area:b; height:14px; border-radius:7px; background:var(--tint); overflow:hidden; display:block}
.brow .bbar i{display:block; height:100%; border-radius:7px; background:var(--forest)}
.brow .bbar i.b1{background:#C94A1C}
.brow .bbar i.b2{background:#5B8F73}
.brow .bbar i.b3{background:#26314D}
.brow .btx{grid-area:t; font-size:calc(14.5*var(--u)); font-weight:600}
.brow.off .btx{color:var(--ink2); text-decoration:line-through}
.pk{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pkc{border-radius:14px; background:var(--tint); padding:14px; display:flex; flex-direction:column; gap:2px; align-items:center}
.pkc small{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2)}
.kgrow{display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:calc(14.5*var(--u)); line-height:1.35}
.kgrow span{background:var(--tint); border-radius:12px; padding:10px 12px}
.ficha{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.ficha div{background:var(--tint); border-radius:12px; padding:9px 10px; display:flex; flex-direction:column; gap:2px; min-width:0}
.ficha small{font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2)}
.ficha b{font-size:calc(14*var(--u)); font-weight:700; line-height:1.25}
.pkc b{font-size:calc(22*var(--u)); font-weight:800}
.pkc span{font-size:calc(16*var(--u)); font-weight:600; color:var(--ink2)}
.msg{display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:16px; background:var(--tint)}
.msgl{min-height:44px; padding:8px 12px; border-radius:12px; border:1.5px solid transparent; background:#fff; text-align:left; font:500 calc(15*var(--u)) var(--sans); color:var(--ink); cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center}
.msgl.on{border-color:#C94A1C; background:#FFF1EC}
.rsub{display:block; margin-top:2px; font-size:calc(13*var(--u)); line-height:1.35; color:var(--ink2)}
.msgl em{font-style:normal; font-size:calc(12*var(--u)); font-weight:700; color:#8A3412; white-space:nowrap}
/* Arashiyama: portrait scenes, shown whole across the width so she stays above the card */
